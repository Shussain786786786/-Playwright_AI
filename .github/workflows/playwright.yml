#To run manually: go to your repo → Actions → Playwright Tests → Run workflow → choose your parameters → Run.
name: Playwright Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select test suite"
        type: choice
        options:
          - test:master
          - test:sanity
          - test:regression
          - test:e2e
          - test:api
          - test:web
          - test:datadriven
        default: "test:e2e"
      browser:
        description: "Select browser"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: "chromium"
      mode:
        description: "Run mode"
        type: choice
        options:
          - headless
          - headed
        default: "headless"
      web_app_url:
        description: "Reachable web app URL (overrides the WEB_APP_URL repository variable)"
        type: string
        required: false
jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name:  Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install Dependencies
        run: npm ci
      - name:  Install Playwright Browsers
        run: npx playwright install --with-deps
      - name:  Create .env File
        run: Copy-Item utils\.env.example .env
      - name:  Run Playwright Tests
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEB_APP_URL)) {
            throw "Set the repository Actions variable WEB_APP_URL or provide web_app_url when manually running this workflow. The URL must be reachable by the runner."
          }
          $suite = "${{ github.event.inputs.test_suite || 'test:e2e' }}"
          $browser = "${{ github.event.inputs.browser || 'chromium' }}"
          $mode = "${{ github.event.inputs.mode || 'headless' }}"
          $tag = $suite -replace 'test:', ''
          $browserFlag = "--project=$browser"
          $modeFlag = if ($mode -eq 'headed') { '--headed' } else { '' }
          npx playwright test --grep "@$tag" $browserFlag $modeFlag --output=test-results
        env:
          CI: "1"
          WEB_APP_URL: ${{ github.event.inputs.web_app_url || vars.WEB_APP_URL }}
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: reports/
          retention-days: 30
      - name: Upload Custom Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: custom-report
          path: custom-report/
          retention-days: 30
      - name:  Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30