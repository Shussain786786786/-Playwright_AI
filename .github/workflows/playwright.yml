#To run manually: go to your repo → Actions → Playwright Tests → Run workflow → choose your parameters → Run.
name: Playwright Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select test suite"
        type: choice
        options:
          - test:master
          - test:sanity
          - test:regression
          - test:e2e
          - test:web
          - test:datadriven
        default: "test:e2e"
      browser:
        description: "Select browser"
        type: choice
        options:
          - chromium
        default: "chromium"
      mode:
        description: "Run mode"
        type: choice
        options:
          - headless
          - headed
        default: "headless"
      web_app_url:
        description: "Reachable OpenCart web app URL (defaults to the Tutorialsninja demo)"
        type: string
        required: false
jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name:  Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install Dependencies
        run: npm ci
      - name:  Install Playwright Browsers
        run: npx playwright install
      - name:  Create .env File
        run: Copy-Item utils\.env.example .env
      - name:  Run Playwright Tests
        run: |
          $webAppUrl = $env:WEB_APP_URL
          if ([string]::IsNullOrWhiteSpace($webAppUrl)) {
            throw "WEB_APP_URL is missing. Provide web_app_url when manually running this workflow."
          }
          $env:WEB_APP_URL = $webAppUrl
          $suite = "${{ github.event.inputs.test_suite || 'test:e2e' }}"
          $browser = "${{ github.event.inputs.browser || 'chromium' }}"
          $mode = "${{ github.event.inputs.mode || 'headless' }}"
          $tag = $suite -replace 'test:', ''
          $browserFlag = "--project=$browser"
          $env:PW_TEST_HEADLESS = if ($mode -eq 'headed') { '0' } else { '1' }
          $playwrightArgs = @('test', '--grep', "@$tag", $browserFlag, '--output=test-results')
          if ($mode -eq 'headed') {
            $playwrightArgs += '--headed'
          }
          npx playwright @playwrightArgs
        env:
          CI: "1"
          WEB_APP_URL: ${{ github.event.inputs.web_app_url || 'https://tutorialsninja.com/demo/' }}
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: reports/
          retention-days: 30
      - name: Upload Custom Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: custom-report
          path: custom-report/
          retention-days: 30
      - name:  Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30